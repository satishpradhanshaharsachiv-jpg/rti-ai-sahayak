name: Build Watch AAB

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Prepare Watch App Files
      run: |
        mkdir -p watch-app/app/src/main/assets
        cp -r * watch-app/app/src/main/assets/ 2>/dev/null || true
        echo "Watch app files prepared successfully"

    - name: Upload Watch Artifact
      uses: actions/upload-artifact@v4
      with:
        name: watch-app-aab
        path: watch-app/
