name: Build Web App

on:
  push:
    branches: [ main ]

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Prepare Web Folder
        run: |
          echo "Preparing Web files"
          mkdir -p dist-folder
          cp index.html dist-folder/

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-folder
          path: dist-folder/
