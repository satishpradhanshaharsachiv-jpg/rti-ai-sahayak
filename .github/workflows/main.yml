name: Build Watch AAB

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Watch Project Structure
      run: |
        npx react-native-tizen init watchApp --skip-install || true
        mkdir -p my-watch-app/app/src/main/assets
        cp -r * my-watch-app/app/src/main/assets/ 2>/dev/null || true
        echo "Watch structure ready"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: samsung-watch-app
        path: my-watch-app/
